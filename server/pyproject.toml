[project]
name = "rodoslovnye"
version = "0.1.0"
description = "Родословные: деревья родов из файлов GEDCOM"
authors = [{ name = "Tyr" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
rodoslovnye = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# длина под сложившийся стиль: в проекте много строк, которые читаются лучше одной, чем тремя
line-length = 140
target-version = "py313"

[tool.ruff.lint]
# F и B ловят настоящие ошибки, остальное держит код однообразным
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "ISC", "RUF"]
# проект русский: кириллица в строках, описаниях и комментариях — это текст, а не опечатка
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest"]
