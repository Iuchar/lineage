[project]
name = "rodoslovnye"
version = "0.1.0"
description = "Родословные: деревья родов из файлов GEDCOM"
authors = [{ name = "Tyr" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
rodoslovnye = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
